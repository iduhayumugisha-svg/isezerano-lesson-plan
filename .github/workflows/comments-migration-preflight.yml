name: Comments Migration Preflight (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comments-migration-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only audit of four legacy comments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ISEZERANO_NEWS }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_ISEZERANO_NEWS."
            exit 1
          }

      - name: Run read-only comments preflight
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ISEZERANO_NEWS }}
          FIREBASE_PROJECT_ID: isezerano-news
          REPORT_PATH: artifacts/comment-migration-dry-run.md
        run: node scripts/prepareCommentMigrationDryRun.mjs

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isezerano-comments-migration-preflight
          path: artifacts/comment-migration-dry-run.md
          if-no-files-found: warn
          retention-days: 7
