name: Firestore Rules Emulator Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "test/firestoreRules.emulator.test.ts"
      - "package.json"
      - "bun.lock"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-tests:
    name: Test Firestore rules in the official emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14

      - name: Run existing static security audit
        run: bun run test:security

      - name: Run Firestore emulator security tests
        run: firebase emulators:exec --only firestore --project demo-isezerano-security "bun run test:rules-emulator"
